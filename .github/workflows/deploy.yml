# Builds the site as static files and publishes it to GitHub Pages on every push to main.
# Live URL: https://<owner>.github.io/<repo>/
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # GitHub Pages has no server, so the try-on API route is left out of this build;
      # the site shows "Launching soon" on the try-on button instead.
      - name: Build static site
        run: |
          rm -rf app/api
          npm run build
          touch out/.nojekyll
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_STATIC_SITE: "true"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
